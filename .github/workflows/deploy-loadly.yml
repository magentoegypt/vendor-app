name: Deploy to Loadly

# Builds a signed Android APK and iOS IPA and uploads both to Loadly for
# testers. Repository secrets:
#   LOADLY_API_KEY                   API key from the Loadly account
#   ANDROID_KEYSTORE_BASE64          base64 of android/android.jks
#   IOS_CERTIFICATE_P12_BASE64       base64 of the Apple Distribution certificate (.p12)
#   IOS_CERTIFICATE_PASSWORD         password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of the Ad Hoc (or Enterprise) profile

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      notes:
        description: Update notes shown to testers on Loadly
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-loadly-${{ github.ref }}
  cancel-in-progress: true

env:
  # pubspec.lock was resolved with Flutter 3.22, and the pinned
  # extended_image / wechat_assets_picker releases do not compile on much
  # newer SDKs, so CI stays on the version the app is built with.
  FLUTTER_VERSION: '3.22.3'
  NOTES: ${{ github.event.inputs.notes || github.event.head_commit.message }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run tests
        # widget_test.dart is the untouched Flutter counter template.
        run: flutter test $(ls test/*_test.dart | grep -v widget_test.dart)

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check secrets
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$LOADLY_API_KEY" ] || missing="$missing LOADLY_API_KEY"
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # android/app/build.gradle signs release builds with android/android.jks.
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android/android.jks

      - name: Build release APK
        run: flutter build apk --release

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload to Loadly
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
        run: bash .github/scripts/loadly-upload.sh build/app/outputs/flutter-apk/app-release.apk Android

  # Skips the iOS build with a warning, instead of failing every run, until
  # the signing secrets are in place.
  ios-secrets:
    name: iOS secrets present
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          for name in LOADLY_API_KEY IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::iOS build skipped. Add these repository secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS IPA
    needs: [test, ios-secrets]
    if: needs.ios-secrets.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Flutter 3.22 predates Xcode 26; use the newest Xcode 16 on the image.
      - name: Select Xcode 16
        run: |
          xcode=$(ls -d /Applications/Xcode_16*.app | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Install signing certificate and profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain"
          rm "$RUNNER_TEMP/dist.p12"

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null; }
          profile_uuid=$(plist UUID)
          team_id=$(plist TeamIdentifier:0)
          # Build with the bundle ID the profile was made for; a wildcard
          # profile keeps the project's own ID.
          app_id=$(plist Entitlements:application-identifier)
          bundle_id=${app_id#"$team_id".}
          if [ -z "$bundle_id" ] || [ "$bundle_id" = "*" ]; then
            bundle_id=com.magentoegypt.multivenors
          fi
          if [ "$(plist ProvisionsAllDevices)" = "true" ]; then
            export_method=enterprise
          elif [ "$(plist Entitlements:get-task-allow)" = "true" ]; then
            export_method=development
          else
            export_method=ad-hoc
          fi
          # Xcode 16 reads profiles from UserData; older Xcodes from MobileDevice.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$profile_uuid.mobileprovision"
          done

          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^ *1) [0-9A-F]* "\(.*\)"$/\1/p')
          if [ -z "$identity" ]; then
            echo "::error::IOS_CERTIFICATE_P12_BASE64 holds no code signing identity"
            exit 1
          fi
          {
            echo "KEYCHAIN_PATH=$keychain"
            echo "PROFILE_UUID=$profile_uuid"
            echo "TEAM_ID=$team_id"
            echo "BUNDLE_ID=$bundle_id"
            echo "EXPORT_METHOD=$export_method"
            echo "SIGN_IDENTITY=$identity"
          } >> "$GITHUB_ENV"
          echo "Signing $bundle_id with \"$identity\", profile \"$(plist Name)\" ($export_method, team $team_id)"

      # The repo's Release config uses automatic signing, which needs an Apple
      # account login. Switch it to this profile on the runner only.
      - name: Use manual signing for Release
        run: |
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install xcodeproj --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          settings = target.build_configurations.find { |c| c.name == 'Release' }.build_settings
          settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM_ID')
          settings['CODE_SIGN_IDENTITY'] = ENV.fetch('SIGN_IDENTITY')
          settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_UUID')
          project.save
          RUBY

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build IPA
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Find the IPA
        run: echo "IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)" >> "$GITHUB_ENV"

      - name: Keep the IPA as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 14

      - name: Upload to Loadly
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
        run: bash .github/scripts/loadly-upload.sh "$IPA_PATH" iOS

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
