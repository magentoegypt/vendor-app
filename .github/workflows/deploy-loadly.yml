name: Deploy to Loadly

# Builds a signed release APK and uploads it to Loadly for testers.
# Needs two repository secrets:
#   LOADLY_API_KEY           API key from the Loadly account
#   ANDROID_KEYSTORE_BASE64  base64 of android/android.jks, the release keystore

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      notes:
        description: Update notes shown to testers on Loadly
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-loadly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check secrets
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$LOADLY_API_KEY" ] || missing="$missing LOADLY_API_KEY"
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # pubspec.lock was resolved with Flutter 3.22, and the pinned
      # extended_image / wechat_assets_picker releases do not compile on much
      # newer SDKs, so CI stays on the version the app is built with.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run tests
        # widget_test.dart is the untouched Flutter counter template.
        run: flutter test $(ls test/*_test.dart | grep -v widget_test.dart)

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # android/app/build.gradle signs release builds with android/android.jks.
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > android/android.jks

      - name: Build release APK
        run: flutter build apk --release

      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload to Loadly
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
          NOTES: ${{ github.event.inputs.notes || github.event.head_commit.message }}
        # --form-string keeps notes starting with @ or < from being read as files.
        run: |
          if ! response=$(curl -sS --fail-with-body --max-time 900 \
              --form-string "_api_key=$LOADLY_API_KEY" \
              --form-string "buildUpdateDescription=$NOTES" \
              -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
              https://api.loadly.io/apiv2/app/upload); then
            echo "::error::Loadly upload request failed: $response"
            exit 1
          fi
          build_key=$(jq -r '.data.buildKey // empty' <<<"$response" 2>/dev/null || true)
          if [ -z "$build_key" ]; then
            echo "::error::Loadly rejected the upload: $response"
            exit 1
          fi
          {
            echo "### Android build on Loadly"
            echo "- Download page: https://loadly.io/$build_key"
            echo "- Version: $(jq -r '.data.buildVersion' <<<"$response") ($(jq -r '.data.buildVersionNo' <<<"$response"))"
            qr=$(jq -r '.data.buildQRCodeURL // empty' <<<"$response")
            if [ -n "$qr" ]; then echo "- QR code: $qr"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded: https://loadly.io/$build_key"
